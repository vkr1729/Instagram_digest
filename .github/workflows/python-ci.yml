name: Python CI (pipeline, server, templates)

# Covers everything the iOS workflow does not: the Python digest pipeline,
# local server endpoints, dashboard/channel templates, and scripts.
# Browser suites run headless Chromium; tests/e2e stays excluded
# (needs live Instagram/network).

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  pytest:
    name: pytest (non-e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install browsers (headless Chromium + ffmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m playwright install --with-deps chromium

      # Maintainer-hardware suites stay local-only: test_grid_view,
      # test_bookmarks_ui and test_mobile_pwa_uat build the viewer from
      # generated site//data files (gitignored; absent on fresh clones), and
      # the desktop-launcher test needs a real install. tests/e2e needs live
      # Instagram/network.
      - name: Run test suite (CI-safe subset)
        run: >-
          python -m pytest tests/ -q
          --ignore=tests/e2e
          --ignore=tests/test_grid_view.py
          --ignore=tests/test_bookmarks_ui.py
          --ignore=tests/test_mobile_pwa_uat.py
          --deselect tests/test_uat_suite7_server_launcher.py::test_uat_7_3_desktop_launcher_file
          --junitxml=pytest-results.xml

      - name: Upload pytest report on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: pytest-results
          path: pytest-results.xml
          if-no-files-found: ignore

      - name: Compile-check entry points and scripts
        run: |
          python -m py_compile main.py local_server.py recommendations.py notifier.py audit_channels.py extractor.py ranker.py site_builder.py storage_r2.py scripts/check_media_urls.py scripts/check_local_media.py

      - name: Shell syntax
        run: |
          for f in *.sh scripts/*.sh; do bash -n "$f"; done
          shellcheck -S error *.sh scripts/*.sh
