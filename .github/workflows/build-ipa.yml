name: Build InstagramDigest iOS App

on:
  push:
    branches:
      - feat/ios-app
      - main
      - arch/direct-meta-stream
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  python-tests:
    name: Run Python Direct Stream Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run Python direct stream tests
        run: |
          pytest tests/test_direct_stream_mode.py tests/test_migrate_r2_bookmarks_to_gh.py -q

      - name: Verify Direct Manifest Contract Pair (AUDIT-071)
        run: |
          grep -q 'Instagram_digest/data_direct.json' Sources/InstagramDigest/Engine/DigestDataService.swift || { echo "ERROR: DigestDataService directManifestURL does not match contract path"; exit 1; }
          grep -q 'data_direct.json' config.py || { echo "ERROR: config.py does not define direct manifest path"; exit 1; }

  build-and-test:
    name: Build, Test & Package IPA
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          if [ -d "/Applications/Xcode_16.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          fi
          xcode-select -p
          XC_VER=$(xcodebuild -version)
          echo "$XC_VER"
          echo "$XC_VER" | grep -q 'Xcode 16' || { echo "ERROR: Expected Xcode 16 toolchain"; exit 1; }
          sudo xcodebuild -runFirstLaunch || true

      - name: Install XcodeGen
        run: |
          XCODEGEN_VERSION="2.42.0"
          XCODEGEN_SHA256="a760b4bf97460341316a2c00d8c87b2946c6c2729eb57e9a72abb3ef7bc0ef82"
          curl -sfSL -o /tmp/xcodegen.zip "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  /tmp/xcodegen.zip" | shasum -a 256 -c -
          unzip -q /tmp/xcodegen.zip -d /tmp
          sudo /tmp/xcodegen/install.sh
          xcodegen --version

      - name: Generate Xcode Project
        run: |
          xcodegen generate

      - name: Discover and Boot iOS Simulator
        id: simulator
        run: |
          # Select one simulator by UDID on the newest available runtime (deterministic).
          DEVICE_JSON=$(xcrun simctl list devices available -j)
          DEVICE_ID=$(echo "$DEVICE_JSON" | jq -r '[.devices | to_entries[] | {runtime: .key, devices: [.value[] | select(.isAvailable and (.name | contains("iPhone")))]} | select(.devices | length > 0)] | sort_by(.runtime) | last | .devices | sort_by(.name) | last | .udid // empty')
          if [ -z "$DEVICE_ID" ]; then
            echo "No available iPhone simulator found"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Discovered simulator UDID: $DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID" 2>/dev/null || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          echo "device_id=$DEVICE_ID" >> "$GITHUB_OUTPUT"

      - name: Run Unit Tests
        run: |
          xcodebuild test \
            -project InstagramDigest.xcodeproj \
            -scheme InstagramDigest \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.device_id }}" \
            -derivedDataPath build/DerivedData \
            -only-testing:InstagramDigestTests \
            -resultBundlePath UnitResults.xcresult \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Run Deep UAT (XCUITest Suite)
        run: |
          xcodebuild test \
            -project InstagramDigest.xcodeproj \
            -scheme InstagramDigest \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.device_id }}" \
            -derivedDataPath build/DerivedData \
            -only-testing:InstagramDigestUITests \
            -resultBundlePath UATResults.xcresult \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Upload Unit Results on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-results
          path: UnitResults.xcresult
          if-no-files-found: ignore

      - name: Upload UAT Results on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: uat-results
          path: UATResults.xcresult
          if-no-files-found: ignore

      - name: Build Release App for Device (Unsigned)
        run: |
          xcodebuild build \
            -project InstagramDigest.xcodeproj \
            -scheme InstagramDigest \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Package Unsigned IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/Build/Products/Release-iphoneos/ -maxdepth 1 -name "*.app" | head -n 1)
          [ -n "$APP_PATH" ] && [ -d "$APP_PATH" ] || { echo "ERROR: No .app found under build/Build/Products/Release-iphoneos/"; exit 1; }
          echo "Packaging app bundle: $APP_PATH"
          cp -R "$APP_PATH" Payload/
          zip -qr InstagramDigestDirect.ipa Payload
          echo "IPA Size: $(ls -lh InstagramDigestDirect.ipa | awk '{print $5}')"
          echo "NOTE: this IPA is UNSIGNED and will not install directly."
          echo "See docs/RE_SIGN_AND_INSTALL.md for re-signing and installation instructions."

      - name: Inspect Package Structure
        run: |
          unzip -l InstagramDigestDirect.ipa | head -n 35

      - name: Upload Unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: InstagramDigestDirect-Unsigned-IPA
          path: InstagramDigestDirect.ipa
          if-no-files-found: error
