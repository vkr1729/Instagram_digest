name: Build InstagramDigest iOS App

on:
  push:
    branches:
      - feat/ios-app
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  build-and-test:
    name: Build, Test & Package IPA
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate

      - name: Discover and Boot iOS Simulator
        id: simulator
        run: |
          # Select one simulator by UDID on the newest available runtime (deterministic).
          DEVICE_JSON=$(xcrun simctl list devices available -j)
          DEVICE_ID=$(echo "$DEVICE_JSON" | jq -r '[.devices | to_entries[] | {runtime: .key, devices: [.value[] | select(.isAvailable and (.name | contains("iPhone")))]} | select(.devices | length > 0)] | sort_by(.runtime) | last | .devices | sort_by(.name) | last | .udid // empty')
          if [ -z "$DEVICE_ID" ]; then
            echo "No available iPhone simulator found"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Discovered simulator UDID: $DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b
          echo "device_id=$DEVICE_ID" >> "$GITHUB_OUTPUT"

      - name: Run Unit Tests
        run: |
          xcodebuild test \
            -project InstagramDigest.xcodeproj \
            -scheme InstagramDigest \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.device_id }}" \
            -derivedDataPath build/DerivedData \
            -only-testing:InstagramDigestTests \
            -resultBundlePath UnitResults.xcresult \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Run Deep UAT (XCUITest Suite)
        run: |
          xcodebuild test \
            -project InstagramDigest.xcodeproj \
            -scheme InstagramDigest \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.device_id }}" \
            -derivedDataPath build/DerivedData \
            -only-testing:InstagramDigestUITests \
            -resultBundlePath UATResults.xcresult \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Upload Unit Results on Failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: unit-results
          path: UnitResults.xcresult
          if-no-files-found: ignore

      - name: Upload UAT Results on Failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: uat-results
          path: UATResults.xcresult
          if-no-files-found: ignore

      - name: Build Release App for Device (Unsigned)
        run: |
          xcodebuild build \
            -project InstagramDigest.xcodeproj \
            -scheme InstagramDigest \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Package Unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/InstagramDigest.app Payload/
          zip -qr InstagramDigest.ipa Payload
          echo "IPA Size: $(ls -lh InstagramDigest.ipa | awk '{print $5}')"
          echo "NOTE: this IPA is UNSIGNED and will not install directly."
          echo "Re-sign before installing, e.g.:"
          echo "  AltStore / Sideloadly / TrollStore, or:"
          echo "  codesign -f -s 'Apple Development' Payload/InstagramDigest.app"

      - name: Inspect Package Structure
        run: |
          unzip -l InstagramDigest.ipa | head -n 35

      - name: Upload Unsigned IPA
        uses: actions/upload-artifact@v5
        with:
          name: InstagramDigest-Unsigned-IPA
          path: InstagramDigest.ipa
          if-no-files-found: error
