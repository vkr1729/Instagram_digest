<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="ig-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cf7a30"/>
      <stop offset="28%" stop-color="#9d435e"/>
      <stop offset="60%" stop-color="#474750"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
  </defs>
  <!-- Rounded Base: Progressive transition from muted IG hue to slate grayscale -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#ig-grad)"/>
  <!-- Inner Camera Contour -->
  <rect x="120" y="120" width="272" height="272" rx="72" fill="none" stroke="#f4f4f6" stroke-width="30"/>
  <!-- Camera Lens Circle -->
  <circle cx="256" cy="256" r="68" fill="none" stroke="#f4f4f6" stroke-width="30"/>
  <!-- Flash Dot -->
  <circle cx="336" cy="176" r="18" fill="#f4f4f6"/>
</svg>
