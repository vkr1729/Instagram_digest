name: InstagramDigest
options:
  bundleIdPrefix: com.instagramdigest
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: complete
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

targets:
  InstagramDigest:
    type: application
    platform: iOS
    sources:
      - path: Sources/InstagramDigest
      - path: Resources
    settings:
      GENERATE_INFOPLIST_FILE: NO
      INFOPLIST_FILE: Sources/InstagramDigest/Info.plist
      CURRENT_PROJECT_VERSION: "1"
      MARKETING_VERSION: "1.0.0"
      INFOPLIST_KEY_CFBundleShortVersionString: "1.0.0"
      INFOPLIST_KEY_CFBundleVersion: "1"
      PRODUCT_BUNDLE_IDENTIFIER: com.instagramdigest.offline
      PRODUCT_NAME: InstagramDigest
      TARGETED_DEVICE_FAMILY: "1"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      CODE_SIGNING_ALLOWED: NO
      CODE_SIGN_IDENTITY: ""
    dependencies: []

  InstagramDigestTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/InstagramDigestTests
    settings:
      GENERATE_INFOPLIST_FILE: YES
      CURRENT_PROJECT_VERSION: "1"
      MARKETING_VERSION: "1.0.0"
      PRODUCT_BUNDLE_IDENTIFIER: com.instagramdigest.offline.tests
      CODE_SIGNING_ALLOWED: NO
      CODE_SIGN_IDENTITY: ""
    dependencies:
      - target: InstagramDigest

  InstagramDigestUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/InstagramDigestUITests
    settings:
      GENERATE_INFOPLIST_FILE: YES
      CURRENT_PROJECT_VERSION: "1"
      MARKETING_VERSION: "1.0.0"
      PRODUCT_BUNDLE_IDENTIFIER: com.instagramdigest.offline.uitests
      TEST_TARGET_NAME: InstagramDigest
      CODE_SIGNING_ALLOWED: NO
      CODE_SIGN_IDENTITY: ""
    dependencies:
      - target: InstagramDigest

schemes:
  InstagramDigest:
    build:
      targets:
        InstagramDigest: all
        InstagramDigestTests: [test]
        InstagramDigestUITests: [test]
    test:
      gatherCoverageData: true
      targets:
        - InstagramDigestTests
        - InstagramDigestUITests

