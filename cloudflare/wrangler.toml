# wrangler.toml — Instagram Digest Bookmarks API.
# Secrets (OWNER_KEY, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID) are set via
# `wrangler secret put` and NEVER committed here.

name = "ig-digest-api"
main = "worker.js"
compatibility_date = "2026-09-01"

[[d1_databases]]
binding = "DB"
database_name = "ig-digest-bookmarks"
database_id = "fcde2249-3ccd-412f-bc6d-ffd341720a54"

[[r2_buckets]]
binding = "MY_BUCKET"
bucket_name = "instagram-digest"

[vars]
R2_PUBLIC_BASE_URL = "https://instagram-digest-media.kedarvreddy.workers.dev"
# Only thumbnails under this prefix may be fetched into R2 (bounded to 2 MB).
THUMB_BASE_URL = "https://vkr1729.github.io/Instagram_digest/thumbnails"
# Extra CORS origins, comma-separated (github.io + localhost:8080 are built in).
ALLOWED_ORIGINS = ""

[triggers]
crons = ["17 4 * * *"]
