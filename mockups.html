<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram Digest — 5 Clean Minimal Mockups</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Grand+Hotel&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-pitch: #000000;
      --bg-card: #0d0e12;
      --border-subtle: rgba(255, 255, 255, 0.1);
      --ig-gradient: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
      --text-main: #f5f5f7;
      --text-muted: #8e8e93;
      --accent-pill: rgba(255, 255, 255, 0.12);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #090a0f;
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      padding: 30px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    header.showcase-header {
      text-align: center;
      margin-bottom: 30px;
      max-width: 800px;
    }
    .showcase-header h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #fff, #a1a1aa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .showcase-header p {
      color: var(--text-muted);
      font-size: 15px;
      line-height: 1.5;
    }
    .nav-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .tab-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .tab-btn.active, .tab-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      border-color: rgba(255, 255, 255, 0.3);
    }

    /* Mobile Frame Preview */
    .mockup-container {
      width: 380px;
      height: 760px;
      background: var(--bg-pitch);
      border-radius: 44px;
      border: 6px solid #22242c;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255,255,255,0.06);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Top App Bar */
    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 18px 8px;
      z-index: 10;
    }
    .app-logo {
      font-family: 'Grand Hotel', cursive;
      font-size: 26px;
      color: #fff;
      letter-spacing: 0.5px;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .speed-badge {
      background: var(--accent-pill);
      padding: 4px 9px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      color: #e4e4e7;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .week-pill {
      font-size: 11px;
      color: #a1a1aa;
      background: rgba(255,255,255,0.06);
      padding: 4px 8px;
      border-radius: 8px;
    }

    /* Story Category Circles */
    .story-row {
      display: flex;
      gap: 12px;
      padding: 6px 16px 12px;
      overflow-x: auto;
      scrollbar-width: none;
      z-index: 10;
    }
    .story-row::-webkit-scrollbar { display: none; }
    .story-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .story-ring {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      padding: 2px;
      background: var(--ig-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .story-ring.active {
      box-shadow: 0 0 10px rgba(220, 39, 67, 0.4);
    }
    .story-inner {
      width: 100%;
      height: 100%;
      background: #14151a;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      border: 2px solid #000;
    }
    .story-label {
      font-size: 10px;
      color: #d4d4d8;
      font-weight: 500;
      white-space: nowrap;
    }

    /* Video Player Viewport */
    .video-viewport {
      flex: 1;
      position: relative;
      background: #121318;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .mock-video-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: linear-gradient(180deg, #1f222e 0%, #0e1017 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #52525b;
      font-size: 13px;
    }

    /* Subtle Native Scrim */
    .scrim-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 40px 16px 20px;
      background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.4) 60%, transparent 100%);
      z-index: 5;
    }
    .creator-line {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }
    .creator-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #3f3f46;
      border: 1px solid rgba(255,255,255,0.2);
    }
    .creator-name {
      font-size: 13px;
      font-weight: 600;
      color: #fff;
    }
    .rank-tag {
      font-size: 11px;
      color: #f09433;
      font-weight: 700;
      margin-left: auto;
    }
    .caption-text {
      font-size: 12px;
      color: #e4e4e7;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Top Segmented Story Dashes (Variant 2) */
    .story-dashes {
      display: flex;
      gap: 3px;
      padding: 6px 16px 0;
      z-index: 10;
    }
    .dash {
      flex: 1;
      height: 2px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 1px;
    }
    .dash.filled { background: #fff; }
    .dash.active {
      background: #fff;
      position: relative;
    }

    /* Dynamic Island (Variant 3) */
    .dynamic-island {
      background: rgba(20, 20, 24, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 5px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 11px;
      font-weight: 600;
      box-shadow: 0 4px 14px rgba(0,0,0,0.5);
    }
    .dynamic-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #22c55e;
    }

    /* Variant 4: Gutter layout */
    .gutter-card {
      margin: 10px 14px;
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.08);
      position: relative;
      flex: 1;
    }

    /* Variant Descriptions & Score Panel */
    .variant-card {
      max-width: 800px;
      background: #121319;
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 20px;
      margin-top: 24px;
      line-height: 1.5;
    }
    .variant-card h3 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .score-badge {
      background: rgba(240, 148, 51, 0.15);
      color: #f09433;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      border: 1px solid rgba(240, 148, 51, 0.3);
    }
    .variant-card p {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    .spec-list {
      display: flex;
      gap: 16px;
      font-size: 12px;
      color: #a1a1aa;
      margin-top: 10px;
      flex-wrap: wrap;
    }
    .spec-item {
      background: rgba(255,255,255,0.04);
      padding: 4px 10px;
      border-radius: 6px;
    }
  </style>
</head>

      document.getElementById("phoneMockup").innerHTML = data.html;

        <h3>${data.title} <span class="score-badge">${data.score}</span></h3>

        <div class="spec-list">

        const keys = Object.keys(variants);
        btn.classList.toggle("active", keys[idx] === vKey);
      });
    }
