<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Instagram Digest — Weekly Top {{ items|length if items else 250 }}</title>

  <!-- iOS PWA & Home Screen App Icon -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Digest">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js?v=20260911_300").catch(err => {
          console.warn("ServiceWorker registration error:", err);
        });
      });
    }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://instagram-digest-media.kedarvreddy.workers.dev" crossorigin>
  <link rel="dns-prefetch" href="https://instagram-digest-media.kedarvreddy.workers.dev">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Grand+Hotel&display=swap" rel="stylesheet">
  <style>
{% include "partials/styles.css" %}
  </style>
</head>
<body>

  <div class="app-shell" id="appShell">
    <!-- Floating Immersive Mode Toast -->
    <div class="toast-overlay" id="globalToast">Double tap screen for full video</div>

    <!-- Gesture Seek Floating HUD Indicator -->
    <div class="seek-hud" id="seekHud">
      <span class="seek-hud-icon">⇄</span>
      <span class="seek-hud-time" id="seekHudTime">0:00 / 0:00</span>
      <span class="seek-hud-delta" id="seekHudDelta">(+0s)</span>
    </div>

    <!-- Floating Top Chrome Overlay (Header + Story Category Bar) -->
{% include "partials/header.html" %}

    <!-- Video Feed Container -->
{% include "partials/feed.html" %}

    <!-- Modals (Jump, Offline Cache, Mindful Daily Limit) -->
{% include "partials/modals.html" %}
  </div>

  <script>
{% include "partials/player.js" %}
  </script>
</body>
</html>
